name: tests

on: push

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Generate the damaged data (seed 42)
        run: python tests/generate_datasets.py
      - name: Run every test
        run: python tests/run_all.py --with-data
