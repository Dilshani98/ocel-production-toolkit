[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ocel-production-toolkit"
version = "1.0.0"
description = "Rebuild an OCEL 2.0 object-centric event log from messy, fragmented production tables."
readme = "PYPI.md"
requires-python = ">=3.11"   # tested on 3.11 and 3.14
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dilshani Subodha Senanayake" }]
keywords = ["process mining", "OCEL 2.0", "object-centric event log", "data cleaning", "manufacturing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Ranges for installing next to other packages. The exact versions the results were produced with are in
# requirements.txt. pm4py is kept to 2.7.x because the export works around that version's writer behaviour.
dependencies = [
    "pandas>=3.0,<4",
    "numpy>=2.0,<3",
    "pm4py>=2.7.23,<2.8",
    "lxml>=5.0",
]

[project.urls]
Homepage = "https://github.com/Dilshani98/ocel-production-toolkit"
Source = "https://github.com/Dilshani98/ocel-production-toolkit"
Issues = "https://github.com/Dilshani98/ocel-production-toolkit/issues"

[project.scripts]
ocel-reconstruct = "reconstruction.cli:main"

[tool.setuptools]
packages = ["reconstruction"]
